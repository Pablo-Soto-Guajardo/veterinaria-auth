spring.application.name=veterinaria-auth

server.port=8081

# Conexion a MySQL. Los valores reales llegan por variables de entorno (Guia 15).
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/veterinaria_auth?createDatabaseIfNotExist=true}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: el secreto NO se escribe aqui; se entrega con la variable JWT_SECRET (Guia 17).
app.jwt.secret=${JWT_SECRET}
# Token de acceso: 15 minutos. Refresh token: 8 horas.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.refresh.expiration-ms=${REFRESH_EXPIRATION_MS:28800000}

# Origen del frontend permitido por CORS (Vite en desarrollo).
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}